<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 92" width="220" height="92">
  <rect width="220" height="92" fill="#0d1117" rx="8"/>

  <!-- O (green #22c55e) -->
  <!-- row 0: █▀▀█ -->
  <rect x="20" y="16" width="12" height="20" fill="#22c55e"/>
  <rect x="32" y="16" width="12" height="10" fill="#22c55e"/>
  <rect x="44" y="16" width="12" height="10" fill="#22c55e"/>
  <rect x="56" y="16" width="12" height="20" fill="#22c55e"/>
  <!-- row 1: █  █ -->
  <rect x="20" y="36" width="12" height="20" fill="#22c55e"/>
  <rect x="56" y="36" width="12" height="20" fill="#22c55e"/>
  <!-- row 2: ▀▀▀▀ -->
  <rect x="20" y="56" width="12" height="10" fill="#22c55e"/>
  <rect x="32" y="56" width="12" height="10" fill="#22c55e"/>
  <rect x="44" y="56" width="12" height="10" fill="#22c55e"/>
  <rect x="56" y="56" width="12" height="10" fill="#22c55e"/>

  <!-- P (white #ffffff) -->
  <!-- row 0: █▀▀█ -->
  <rect x="80" y="16" width="12" height="20" fill="#ffffff"/>
  <rect x="92" y="16" width="12" height="10" fill="#ffffff"/>
  <rect x="104" y="16" width="12" height="10" fill="#ffffff"/>
  <rect x="116" y="16" width="12" height="20" fill="#ffffff"/>
  <!-- row 1: █▀▀▀ -->
  <rect x="80" y="36" width="12" height="20" fill="#ffffff"/>
  <rect x="92" y="36" width="12" height="10" fill="#ffffff"/>
  <rect x="104" y="36" width="12" height="10" fill="#ffffff"/>
  <rect x="116" y="36" width="12" height="10" fill="#ffffff"/>
  <!-- row 2: ▀ -->
  <rect x="80" y="56" width="12" height="10" fill="#ffffff"/>

  <!-- M (white #ffffff) -->
  <!-- row 0: █▀▄▀█  (▀=top half, ▄=bottom half) -->
  <rect x="140" y="16" width="12" height="20" fill="#ffffff"/>
  <rect x="152" y="16" width="12" height="10" fill="#ffffff"/>
  <rect x="164" y="26" width="12" height="10" fill="#ffffff"/>
  <rect x="176" y="16" width="12" height="10" fill="#ffffff"/>
  <rect x="188" y="16" width="12" height="20" fill="#ffffff"/>
  <!-- row 1: █   █ -->
  <rect x="140" y="36" width="12" height="20" fill="#ffffff"/>
  <rect x="188" y="36" width="12" height="20" fill="#ffffff"/>
  <!-- row 2: ▀   ▀ -->
  <rect x="140" y="56" width="12" height="10" fill="#ffffff"/>
  <rect x="188" y="56" width="12" height="10" fill="#ffffff"/>
</svg>
